name: CI

on:
  push:
  pull_request:

# Отменяем предыдущий незавершённый прогон на том же PR/ветке при новом пуше —
# не тратим минуты раннера на заведомо устаревший коммит.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # lint: golangci-lint отдельно для каждого Go-модуля (core, restaurant-service
  # — независимые go.mod, поэтому и линтуются раздельно). Самый быстрый job,
  # не требует Docker/сети к БД — падает первым, если падает.
  # ---------------------------------------------------------------------
  lint:
    name: lint (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [core, restaurant-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          working-directory: ${{ matrix.dir }}
          # .golangci.yml лежит в корне репозитория, golangci-lint сам находит
          # конфиг, поднимаясь по дереву директорий вверх от working-directory.

  # ---------------------------------------------------------------------
  # generate-check: проверяем, что *.gen.go в репозитории совпадают с тем,
  # что реально генерирует oapi-codegen из текущих api/openapi/*.yaml —
  # то есть спека и сгенерированный код не разъехались (см. план, раздел
  # 6.4 — ровно та проблема, которую кодогенерация должна была устранить;
  # эта проверка гарантирует, что она не появится обратно "тихой правкой").
  # ---------------------------------------------------------------------
  generate-check:
    name: generate-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: make generate
        run: make generate

      - name: Проверить отсутствие diff после генерации
        run: |
          if ! git diff --quiet -- '*.gen.go'; then
            echo "::error::Сгенерированный код (*.gen.go) не совпадает со спекой api/openapi/*.yaml."
            echo "::error::Похоже, кто-то отредактировал *.gen.go руками или забыл прогнать 'make generate' после правки спеки."
            git diff -- '*.gen.go'
            exit 1
          fi

  # ---------------------------------------------------------------------
  # unit-test: юнит-тесты без -race (race — отдельная забота test-race/
  # test-docker в Makefile, задуманных прежде всего для Windows-разработки,
  # см. README) и без testcontainers (integration-тесты — отдельный job).
  # ---------------------------------------------------------------------
  unit-test:
    name: unit-test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [core, restaurant-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: go test ./... -cover
        working-directory: ${{ matrix.dir }}
        run: go test ./... -race -cover

  # ---------------------------------------------------------------------
  # integration-test: testcontainers-go поднимает реальный PostgreSQL —
  # только core-модуль, только пакет repository/postgres, только с
  # build-тегом integration. ubuntu-latest раннеры GitHub Actions уже
  # имеют Docker-демон — testcontainers подключается к нему без
  # дополнительной настройки (docker:dind не нужен).
  # ---------------------------------------------------------------------
  integration-test:
    name: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: go test -tags=integration ./internal/repository/postgres/...
        working-directory: core
        run: go test -tags=integration ./internal/repository/postgres/... -v -cover

  # ---------------------------------------------------------------------
  # build: чистая сборка бинарников каждого модуля — быстрая защита от
  # "забыл закоммитить файл"/платформенных различий компиляции.
  # ---------------------------------------------------------------------
  build:
    name: build (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [core, restaurant-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: go build ./...
        working-directory: ${{ matrix.dir }}
        run: go build ./...

  # ---------------------------------------------------------------------
  # docker-smoke: собирает весь стек через docker compose (как реально
  # будет делать проверяющий по ТЗ: "приложение поднимается и выполняет
  # все бизнес-сценарии") и прогоняет минимальный E2E-сценарий через curl —
  # список заведений -> меню -> создание заказа -> получение заказа.
  # Это ровно тот класс проблем, что уже один раз ловился руками
  # (рассинхронизация версии Go между go.mod и Docker-образами, см. план
  # раздел 11.3 п.5) — здесь он будет пойман автоматически при следующем
  # случайном "go get -u" или правке Dockerfile.
  # ---------------------------------------------------------------------
  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose build
        run: docker compose build

      - name: docker compose up (ждём healthy/completed)
        run: docker compose up -d --wait --wait-timeout 120

      - name: Проверка /health обоих сервисов
        run: |
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080/health
          curl -sf --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8090/health

      - name: E2E-сценарий — список заведений -> меню -> заказ -> получение заказа
        run: |
          set -euo pipefail
          VENUE_ID="11111111-1111-1111-1111-111111111111"

          venues=$(curl -sf http://localhost:8080/api/v1/client/venues)
          echo "venues: $venues"
          echo "$venues" | jq -e --arg id "$VENUE_ID" 'map(select(.id == $id)) | length == 1' > /dev/null

          menu=$(curl -sf "http://localhost:8080/api/v1/client/venues/$VENUE_ID/menu")
          echo "menu: $menu"
          ITEM_ID=$(echo "$menu" | jq -r '.items[] | select(.isAvailable == true) | .id' | head -1)
          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
            echo "::error::Не нашли доступную позицию меню в сид-данных"
            exit 1
          fi

          order=$(curl -sf -X POST http://localhost:8080/api/v1/client/orders \
            -H 'Content-Type: application/json' \
            -d "{\"venueId\":\"$VENUE_ID\",\"customerRef\":\"ci-smoke\",\"items\":[{\"menuItemId\":\"$ITEM_ID\",\"quantity\":1}]}")
          echo "order: $order"
          ORDER_ID=$(echo "$order" | jq -r '.id')
          STATUS=$(echo "$order" | jq -r '.status')
          if [ "$STATUS" != "CREATED" ]; then
            echo "::error::Ожидался статус CREATED сразу после создания заказа, получили $STATUS"
            exit 1
          fi

          got=$(curl -sf "http://localhost:8080/api/v1/client/orders/$ORDER_ID")
          echo "got order: $got"
          echo "$got" | jq -e --arg id "$ORDER_ID" '.id == $id' > /dev/null

      - name: Логи сервисов (на случай падения предыдущих шагов)
        if: failure()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v
